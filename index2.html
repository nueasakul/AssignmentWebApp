<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Management - ID: 67010999</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    nav { margin-bottom: 20px; }
    nav button { padding: 10px 15px; margin-right: 5px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
    nav button.active { background: #007bff; color: #fff; border-color: #007bff; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; }
    .page { display: none; }
    .page.active { display: block; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
    button.submit-btn { background: #28a745; color: #fff; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
    table, th, td { border: 1px solid #ddd; }
    th, td { padding: 10px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>

  <h1>Drone Management System</h1>
  
  <nav>
    <button id="btn-page1" class="active" onclick="showPage('page1')">1. Config View</button>
    <button id="btn-page2" onclick="showPage('page2')">2. Log Entry Form</button>
    <button id="btn-page3" onclick="showPage('page3')">3. View Logs</button>
  </nav>

  <!-- Page 1: Config View -->
  <div id="page1" class="page active">
    <div class="card">
      <h2>Drone Configuration</h2>
      <p><strong>Drone ID:</strong> <span id="conf-id">Loading...</span></p>
      <p><strong>Drone Name:</strong> <span id="conf-name">Loading...</span></p>
      <p><strong>Light Status:</strong> <span id="conf-light">Loading...</span></p>
      <p><strong>Country:</strong> <span id="conf-country">Loading...</span></p>
      <p><strong>Weight:</strong> <span id="conf-weight">Loading...</span> kg</p>
    </div>
  </div>

  <!-- Page 2: Log Entry Form -->
  <div id="page2" class="page">
    <div class="card">
      <h2>บันทึกอุณหภูมิโดรน</h2>
      <form id="logForm" onsubmit="submitLog(event)">
        <div class="form-group">
          <label>Drone ID</label>
          <input type="text" id="form-id" readonly>
        </div>
        <div class="form-group">
          <label>Drone Name</label>
          <input type="text" id="form-name" readonly>
        </div>
        <div class="form-group">
          <label>Country</label>
          <input type="text" id="form-country" readonly>
        </div>
        <div class="form-group">
          <label>Temperature (°C)</label>
          <input type="number" id="form-celsius" placeholder="กรอกอุณหภูมิ เช่น 25" required step="any">
        </div>
        <button type="submit" class="submit-btn">บันทึกข้อมูล Log</button>
      </form>
    </div>
  </div>

  <!-- Page 3: View Logs Table -->
  <div id="page3" class="page">
    <h2>ประวัติอุณหภูมิ 12 รายการล่าสุด</h2>
    <table>
      <thead>
        <tr>
          <th>Drone ID</th>
          <th>Drone Name</th>
          <th>Temperature (°C)</th>
          <th>Country</th>
          <th>Created Date</th>
        </tr>
      </thead>
      <tbody id="logsTableBody">
        <tr><td colspan="5">กำลังโหลดข้อมูล...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:3000';
    const DRONE_ID = '67010999';

    let droneConfigCache = null;

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      
      document.getElementById(pageId).classList.add('active');
      if (pageId === 'page1') document.getElementById('btn-page1').classList.add('active');
      if (pageId === 'page2') document.getElementById('btn-page2').classList.add('active');
      if (pageId === 'page3') {
        document.getElementById('btn-page3').classList.add('active');
        fetchLogs();
      }
    }

    // 1. ดึงข้อมูล Config จาก Server 1
    async function fetchConfig() {
      try {
        const res = await fetch(`${API_BASE_URL}/configs/${DRONE_ID}`);
        const data = await res.json();
        droneConfigCache = data;

        // แสดงผลหน้า 1
        document.getElementById('conf-id').innerText = data.drone_id;
        document.getElementById('conf-name').innerText = data.drone_name;
        document.getElementById('conf-light').innerText = data.light;
        document.getElementById('conf-country').innerText = data.country;
        document.getElementById('conf-weight').innerText = data.weight;

        // นำข้อมูลลงฟอร์มหน้า 2
        document.getElementById('form-id').value = data.drone_id;
        document.getElementById('form-name').value = data.drone_name;
        document.getElementById('form-country').value = data.country;
      } catch (err) {
        console.error('Error fetching config:', err);
      }
    }

    // 2. ส่งข้อมูลอุณหภูมิ + ข้อมูลเดิมไป Server 2 (PocketBase)
    async function submitLog(e) {
      e.preventDefault();
      const celsiusVal = document.getElementById('form-celsius').value;

      const payload = {
        drone_id: Number(DRONE_ID),
        drone_name: droneConfigCache ? droneConfigCache.drone_name : "Opeoid",
        country: droneConfigCache ? droneConfigCache.country : "Peru",
        celsius: Number(celsiusVal)
      };

      try {
        const res = await fetch(`${API_BASE_URL}/logs`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('บันทึกอุณหภูมิลง Server 2 สำเร็จ!');
          document.getElementById('form-celsius').value = '';
          showPage('page3'); // เด้งไปหน้าตารางประวัติทันที
        } else {
          alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
        }
      } catch (err) {
        console.error('Error posting log:', err);
        alert('ไม่สามารถติดต่อ Server ได้');
      }
    }

    // 3. ดึงประวัติจาก Server 2 มาสร้างตาราง
    async function fetchLogs() {
      const tbody = document.getElementById('logsTableBody');
      tbody.innerHTML = '<tr><td colspan="5">กำลังโหลดข้อมูล...</td></tr>';

      try {
        const res = await fetch(`${API_BASE_URL}/logs/${DRONE_ID}`);
        const logs = await res.json();

        if (!Array.isArray(logs) || logs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5">ยังไม่มีข้อมูลประวัติอุณหภูมิ</td></tr>';
          return;
        }

        tbody.innerHTML = logs.map(item => `
          <tr>
            <td>${item.drone_id}</td>
            <td>${item.drone_name}</td>
            <td>${item.celsius}</td>
            <td>${item.country}</td>
            <td>${new Date(item.created).toLocaleString('th-TH')}</td>
          </tr>
        `).join('');

      } catch (err) {
        console.error('Error fetching logs:', err);
        tbody.innerHTML = '<tr><td colspan="5">เกิดข้อผิดพลาดในการดึงข้อมูลประวัติ</td></tr>';
      }
    }

    fetchConfig();
  </script>
</body>
</html>
